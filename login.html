<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player — Pairing</title>
  <style>
    :root {
      --canvas: #f5f3f0;
      --surface: #fffdfb;
      --surface-soft: #faf7f4;
      --red: #c43d3d;
      --red-dark: #a92f2f;
      --red-soft: #fbe7e7;
      --text: #292524;
      --muted: #78716c;
      --subtle: #a8a29e;
      --border: #e7e1dc;
    }
    * { box-sizing: border-box; }
    body {
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 28px; overflow: hidden;
      background: var(--canvas); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body::before, body::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
      background: rgba(196, 61, 61, .06);
    }
    body::before { width: 260px; height: 260px; top: -145px; right: -105px; }
    body::after { width: 190px; height: 190px; left: -115px; bottom: -105px; }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 360px; padding: 30px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: 0 18px 50px rgba(74, 52, 46, .1);
    }
    .identity { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
    .brand-mark {
      display: grid; place-items: center; flex: 0 0 43px; width: 43px; height: 43px;
      border-radius: 13px; background: var(--red); color: white;
      box-shadow: 0 8px 20px rgba(196, 61, 61, .24);
    }
    .brand-mark svg { width: 21px; fill: currentColor; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -.4px; }
    .product {
      margin-top: 2px; color: var(--subtle); font-size: 9px; font-weight: 700;
      letter-spacing: .9px; text-transform: uppercase;
    }
    .welcome { margin-bottom: 22px; }
    .welcome h2 { margin: 0 0 5px; font-size: 18px; letter-spacing: -.3px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 11px; font-weight: 650; }
    input, select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px;
      outline: none; background: var(--surface-soft); color: var(--text); font-size: 13px;
      transition: border-color .12s, box-shadow .12s, background .12s;
    }
    input::placeholder { color: #b9b1ab; }
    input:focus, select:focus {
      border-color: var(--red); background: var(--surface);
      box-shadow: 0 0 0 3px rgba(196, 61, 61, .1);
    }
    button {
      width: 100%; margin-top: 22px; padding: 11px 12px; border: 1px solid var(--red);
      border-radius: 9px; background: var(--red); color: white; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: background .12s, border-color .12s, transform .12s;
    }
    button:hover { border-color: var(--red-dark); background: var(--red-dark); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { border-color: #d8cfca; background: #d8cfca; color: #fffaf7; cursor: not-allowed; }
    .divider {
      display: flex; align-items: center; gap: 9px; margin-top: 15px;
      color: var(--subtle); font-size: 9px; font-weight: 650; text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .btn-secondary {
      margin-top: 13px; border-color: #e9c9c7; background: var(--surface);
      color: var(--red-dark); font-weight: 650;
    }
    .btn-secondary:hover { border-color: #dfaaa7; background: var(--red-soft); }
    .btn-secondary:disabled { border-color: var(--border); background: var(--surface-soft); color: #b9b1ab; }
    .err {
      display: none; margin-top: 14px; padding: 10px 11px; border: 1px solid #efcbc9;
      border-radius: 8px; background: #fff3f2; color: var(--red-dark);
      font-size: 11px; line-height: 1.4;
    }
    .err.show { display: block; }
    .hidden { display: none !important; }
    .footnote { margin: 17px 0 0; color: var(--subtle); font-size: 9px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="identity">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></div>
      <div><h1>Player</h1><div class="product">Realtime media playback</div></div>
    </div>

    <div class="welcome">
      <h2>Connect this player</h2>
      <p class="subtitle">Sign in as an authorized CMS operator, then select the device assigned to this PC.</p>
    </div>

    <label for="serverURL">CMS Server URL</label>
    <input id="serverURL" name="serverURL" type="url" placeholder="http://192.168.1.10:8080" required autocomplete="url" autofocus />

    <div id="loginStep">
      <label for="email">Operator email</label>
      <input id="email" name="email" type="email" placeholder="operator@example.com" required autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" />

      <button type="submit" id="btn">Sign In</button>
    </div>

    <div id="deviceStep" class="hidden">
      <label for="deviceId">Assigned device</label>
      <select id="deviceId"></select>
      <button type="button" id="btnClaim">Connect Player</button>
      <button type="button" id="btnBack" class="btn-secondary">Use another account</button>
    </div>

    <div id="testDivider" class="divider hidden">Local testing</div>
    <button type="button" id="btnTest" class="btn-secondary hidden">Test Mode (development only)</button>

    <div class="err" id="err" role="alert"></div>
    <p class="footnote">Scheduled playback continues locally when the CMS connection is temporarily unavailable.</p>
  </form>

  <script>
    const { ipcRenderer } = require('electron');
    const form = document.getElementById('f');
    const btn = document.getElementById('btn');
    const btnTest = document.getElementById('btnTest');
    const btnClaim = document.getElementById('btnClaim');
    const btnBack = document.getElementById('btnBack');
    const errEl = document.getElementById('err');

    function setBusy(busy) {
      btn.disabled = busy;
      btnClaim.disabled = busy;
      btnBack.disabled = busy;
      btnTest.disabled = busy;
      btn.textContent = busy ? 'Signing in...' : 'Sign In';
      btnClaim.textContent = busy ? 'Connecting...' : 'Connect Player';
      btnTest.textContent = busy ? 'Starting...' : 'Test Mode (skip login)';
    }

    form.onsubmit = async event => {
      event.preventDefault();
      errEl.classList.remove('show');
      setBusy(true);
      const payload = Object.fromEntries(new FormData(form));
      try {
        const result = await ipcRenderer.invoke('setup-login', payload);
        if (!result || !result.ok) throw new Error(result && result.error || 'Login failed');
        const select = document.getElementById('deviceId');
        select.replaceChildren();
        for (const device of result.devices || []) {
          const option = document.createElement('option');
          option.value = device.id;
          option.textContent = `${device.name}${device.location ? ` — ${device.location}` : ''}`;
          select.appendChild(option);
        }
        if (!select.options.length) throw new Error('No pending device is assigned to this operator.');
        document.getElementById('loginStep').classList.add('hidden');
        document.getElementById('deviceStep').classList.remove('hidden');
        setBusy(false);
      } catch (error) {
        errEl.textContent = error.message || String(error);
        errEl.classList.add('show');
        setBusy(false);
      }
    };

    btnClaim.onclick = async () => {
      errEl.classList.remove('show'); setBusy(true);
      try {
        const result = await ipcRenderer.invoke('claim-player', { deviceId: document.getElementById('deviceId').value });
        if (!result || !result.ok) throw new Error(result && result.error || 'Device claim failed');
      } catch (error) {
        errEl.textContent = error.message || String(error); errEl.classList.add('show'); setBusy(false);
      }
    };

    btnBack.onclick = async () => {
      await ipcRenderer.invoke('setup-cancel').catch(() => {});
      document.getElementById('deviceStep').classList.add('hidden');
      document.getElementById('loginStep').classList.remove('hidden');
      document.getElementById('password').value = '';
    };

    ipcRenderer.invoke('get-pairing-defaults').then(defaults => {
      if (defaults && defaults.serverURL && !document.getElementById('serverURL').value) {
        document.getElementById('serverURL').value = defaults.serverURL;
      }
      if (defaults && defaults.testModeEnabled) {
        btnTest.classList.remove('hidden');
        document.getElementById('testDivider').classList.remove('hidden');
      }
    }).catch(() => {});

    btnTest.onclick = async () => {
      errEl.classList.remove('show');
      setBusy(true);
      try {
        const result = await ipcRenderer.invoke('login-bypass');
        if (!result || !result.ok) throw new Error(result && result.error || 'Bypass failed');
      } catch (error) {
        errEl.textContent = error.message || String(error);
        errEl.classList.add('show');
        setBusy(false);
      }
    };
  </script>
</body>
</html>
