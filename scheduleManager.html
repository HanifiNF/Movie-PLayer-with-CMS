<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player — Schedule Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: #0b1220; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 20px;
    }
    h1 { margin: 0; color: #38bdf8; font-size: 24px; }
    .subtitle { margin-top: 5px; color: #64748b; font-size: 12px; }
    .toolbar {
      display: grid; grid-template-columns: minmax(220px, 1fr) 180px auto;
      gap: 10px; margin-bottom: 16px;
    }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #334155;
      background: #111c30; color: #e2e8f0; border-radius: 8px;
    }
    button {
      padding: 9px 12px; border: 1px solid #334155; border-radius: 7px;
      background: #1e293b; color: #cbd5e1; cursor: pointer; white-space: nowrap;
    }
    button:hover { border-color: #38bdf8; color: #38bdf8; }
    button.primary { background: #38bdf8; color: #07111f; border-color: #38bdf8; font-weight: 700; }
    button.danger:hover { color: #fca5a5; border-color: #ef4444; }
    .table-wrap { overflow-x: auto; border: 1px solid #1e293b; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th {
      padding: 11px; background: #111c30; color: #94a3b8;
      text-align: left; font-size: 11px; text-transform: uppercase;
    }
    td { padding: 12px 11px; border-top: 1px solid #1e293b; vertical-align: top; font-size: 13px; }
    tr:hover td { background: rgba(30, 41, 59, .45); }
    .title { font-weight: 650; color: #f1f5f9; }
    .muted { color: #64748b; font-size: 11px; margin-top: 4px; }
    .badge {
      display: inline-block; padding: 4px 8px; border-radius: 999px;
      font-size: 10px; text-transform: uppercase; font-weight: 700;
      background: #334155; color: #cbd5e1;
    }
    .badge.active { background: #14532d; color: #86efac; }
    .badge.upcoming, .badge.ready { background: #164e63; color: #67e8f9; }
    .badge.completed { background: #292524; color: #a8a29e; }
    .badge.disabled { background: #3f3f46; color: #a1a1aa; }
    .priority { font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .actions button { padding: 6px 8px; font-size: 11px; }
    .empty { padding: 50px; text-align: center; color: #64748b; }
    .error {
      display: none; padding: 10px 12px; margin-bottom: 14px;
      background: #7f1d1d; color: #fecaca; border-radius: 7px; font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Schedule Manager</h1>
      <div class="subtitle">Local Test Mode schedules persist across player restarts.</div>
    </div>
    <button id="btnAdd" class="primary">+ Add Schedule</button>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Search schedule or media..." />
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="upcoming">Upcoming</option>
      <option value="ready">Ready</option>
      <option value="completed">Completed</option>
      <option value="disabled">Disabled</option>
    </select>
    <button id="btnRefresh">Refresh</button>
  </div>
  <div class="error" id="error"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Schedule</th>
          <th>Status</th>
          <th>Start / Duration</th>
          <th>Recurrence</th>
          <th>Priority</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No schedules found.</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const rows = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');
    const statusFilter = document.getElementById('statusFilter');
    const errorEl = document.getElementById('error');
    let schedules = [];
    let loading = false;

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString();
    }

    function formatDuration(schedule) {
      const seconds = Math.max(
        0,
        Math.ceil((new Date(schedule.endTime) - new Date(schedule.startTime)) / 1000)
      );
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;
      return [hours, minutes, remainder].map(value => String(value).padStart(2, '0')).join(':');
    }

    function recurrenceLabel(schedule) {
      if (!schedule.recurrence) return 'One-time';
      if (schedule.recurrence.freq === 'daily') return 'Daily';
      const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      return `Weekly: ${(schedule.recurrence.daysOfWeek || [])
        .map(day => names[day - 1]).filter(Boolean).join(', ')}`;
    }

    function mediaLabel(schedule) {
      return (schedule.files || []).map(file => file.title || file.path || file.assetId).join(', ');
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = message ? 'block' : 'none';
    }

    function actionButton(label, action, className = '') {
      const button = document.createElement('button');
      button.textContent = label;
      button.className = className;
      button.onclick = action;
      return button;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const wantedStatus = statusFilter.value;
      const visible = schedules.filter(schedule => {
        const searchable = `${schedule.title} ${schedule.id} ${mediaLabel(schedule)}`.toLowerCase();
        return (!query || searchable.includes(query)) &&
          (!wantedStatus || schedule.status === wantedStatus);
      });
      rows.innerHTML = '';
      empty.style.display = visible.length ? 'none' : 'block';

      for (const schedule of visible) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        const name = document.createElement('div');
        name.className = 'title';
        name.textContent = schedule.title;
        const media = document.createElement('div');
        media.className = 'muted';
        media.textContent = mediaLabel(schedule);
        nameCell.append(name, media);

        const statusCell = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `badge ${schedule.status}`;
        badge.textContent = schedule.status;
        statusCell.appendChild(badge);

        const timeCell = document.createElement('td');
        timeCell.textContent = formatDate(schedule.startTime);
        const duration = document.createElement('div');
        duration.className = 'muted';
        duration.textContent = `Duration ${formatDuration(schedule)}`;
        timeCell.appendChild(duration);

        const recurrenceCell = document.createElement('td');
        recurrenceCell.textContent = recurrenceLabel(schedule);

        const priorityCell = document.createElement('td');
        priorityCell.className = 'priority';
        priorityCell.textContent = String(schedule.priority || 0);

        const actionsCell = document.createElement('td');
        actionsCell.className = 'actions';
        actionsCell.append(
          actionButton('Edit', () => ipcRenderer.invoke('open-schedule-adder', schedule.id)),
          actionButton('Duplicate', () => mutate('duplicate-test-schedule', schedule.id)),
          actionButton(
            schedule.enabled === false ? 'Enable' : 'Disable',
            () => mutate('toggle-test-schedule', schedule.id)
          ),
          actionButton('Delete', async () => {
            if (!confirm(`Delete "${schedule.title}"?`)) return;
            await mutate('delete-test-schedule', schedule.id);
          }, 'danger')
        );

        row.append(nameCell, statusCell, timeCell, recurrenceCell, priorityCell, actionsCell);
        rows.appendChild(row);
      }
    }

    async function mutate(channel, scheduleId) {
      showError('');
      const result = await ipcRenderer.invoke(channel, scheduleId);
      if (!result || !result.ok) {
        showError(result && result.error || 'Operation failed');
        return;
      }
      await refresh();
    }

    async function refresh() {
      if (loading) return;
      loading = true;
      try {
        const result = await ipcRenderer.invoke('list-test-schedules');
        if (!result || !result.ok) throw new Error(result && result.error || 'Failed to load schedules');
        schedules = result.schedules || [];
        schedules.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
        showError('');
        render();
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        loading = false;
      }
    }

    search.oninput = render;
    statusFilter.onchange = render;
    document.getElementById('btnRefresh').onclick = refresh;
    document.getElementById('btnAdd').onclick = () => ipcRenderer.invoke('open-schedule-adder');
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
