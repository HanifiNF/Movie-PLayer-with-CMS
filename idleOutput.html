<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Idle Output</title>
  <style>
    html, body, video {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      display: block;
      object-fit: cover;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="idleVideo" autoplay muted loop playsinline disablepictureinpicture></video>
  <script>
    const video = document.getElementById('idleVideo');
    const media = new URLSearchParams(window.location.search).get('media');
    if (media) {
      video.src = media;
      video.play().catch(() => {});
    }
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play().catch(() => {});
    });
  </script>
</body>
</html>
