<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player — Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1220; color: #e2e8f0;
      user-select: none;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; background: #0f172a; border-bottom: 1px solid #1e293b;
    }
    header .brand { display: flex; align-items: baseline; gap: 14px; }
    header .brand h1 { margin: 0; font-size: 18px; color: #38bdf8; letter-spacing: 0.5px; }
    header .brand .ver { font-size: 11px; color: #64748b; }
    header .right { display: flex; align-items: center; gap: 14px; font-size: 12px; color: #94a3b8; }
    header .device { font-family: ui-monospace, Consolas, monospace; }
    header .clock {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px; color: #38bdf8; font-variant-numeric: tabular-nums;
    }

    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.6px; text-transform: uppercase;
    }
    .badge.online { background: #064e3b; color: #34d399; }
    .badge.offline { background: #450a0a; color: #fca5a5; }
    .badge.connecting { background: #1e1b4b; color: #a5b4fc; }
    .badge.test-mode { background: #1e293b; color: #fbbf24; border: 1px solid #475569; }
    .badge.vlc-error { background: #450a0a; color: #fca5a5; }
    .badge.vlc-recovering { background: #422006; color: #fcd34d; }

    main { flex: 1; padding: 18px 22px; overflow: auto; display: grid; grid-template-rows: auto 1fr; gap: 16px; }

    .now {
      background: #111c33; border: 1px solid #1e293b; border-radius: 12px; padding: 18px 22px;
    }
    .now h2 { margin: 0 0 6px; font-size: 12px; color: #94a3b8; letter-spacing: 1.2px; text-transform: uppercase; }
    .now .title { font-size: 22px; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; }
    .now .file { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #64748b; word-break: break-all; }
    .now .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 14px; flex-wrap: wrap; }
    .now .countdown { font-size: 14px; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .now .actions { display: flex; gap: 8px; }
    .now .empty { color: #64748b; font-style: italic; }
    .playback-details { margin-top: 14px; padding: 12px; background: #0f172a; border-radius: 9px; }
    .playback-details.hidden { display: none; }
    .playback-head, .playback-time {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      font-size: 12px;
    }
    .playback-head strong { color: #e2e8f0; font-size: 14px; }
    .playback-position { color: #38bdf8; white-space: nowrap; }
    .progress-track {
      height: 7px; margin: 9px 0 7px; overflow: hidden;
      background: #1e293b; border-radius: 999px;
    }
    .progress-fill { height: 100%; width: 0; background: #38bdf8; transition: width .35s linear; }
    .playback-time { color: #94a3b8; font-variant-numeric: tabular-nums; }
    .playback-next { margin-top: 7px; color: #64748b; font-size: 11px; }

    .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; min-height: 0; }
    .panel { background: #111c33; border: 1px solid #1e293b; border-radius: 12px; padding: 16px 20px; overflow: auto; }
    .panel h2 { margin: 0 0 10px; font-size: 12px; color: #94a3b8; letter-spacing: 1.2px; text-transform: uppercase; }
    .panel ul { margin: 0; padding: 0; list-style: none; }
    .panel li {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 9px 0; border-bottom: 1px dashed #1e293b; font-size: 13px;
    }
    .panel li:last-child { border-bottom: none; }
    .panel li .time { color: #38bdf8; font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }
    .panel li .ttl { color: #e2e8f0; flex: 1; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel li .rec { color: #64748b; font-size: 11px; }
    .panel .empty { color: #64748b; font-style: italic; font-size: 13px; padding: 6px 0; }

    .vlc-state {
      display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    }
    .vlc-state.playing { background: #064e3b; color: #34d399; }
    .vlc-state.paused  { background: #422006; color: #fbbf24; }
    .vlc-state.idle    { background: #1e293b; color: #94a3b8; }
    .vlc-state.error   { background: #450a0a; color: #fca5a5; }

    .vlc-note { font-size: 11px; color: #fca5a5; margin-top: 6px; min-height: 14px; }
    .health-section { margin-top: 15px; padding-top: 13px; border-top: 1px solid #1e293b; }
    .health-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .health-head h3 { margin: 0; font-size: 11px; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
    .health-state { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .health-state.healthy { color: #34d399; }
    .health-state.warning, .health-state.checking { color: #fbbf24; }
    .health-state.error { color: #fca5a5; }
    .health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 9px; font-size: 11px; }
    .health-grid span { color: #64748b; }
    .health-grid strong { display: block; margin-top: 2px; color: #e2e8f0; font-size: 12px; }
    .health-details { margin-top: 7px; color: #fca5a5; font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }

    .btn {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; cursor: pointer; transition: background .12s;
    }
    .btn:hover { background: #334155; }
    .btn:disabled { background: #0f172a; color: #475569; cursor: not-allowed; border-color: #1e293b; }
    .btn.primary { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 600; }
    .btn.primary:hover { background: #0ea5e9; }
    .btn.danger { background: #7f1d1d; color: #fecaca; border-color: #7f1d1d; }
    .btn.danger:hover { background: #991b1b; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .icon-btn {
      position: relative; width: 38px; height: 36px; padding: 7px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn svg .solid { fill: currentColor; stroke: none; }
    .icon-btn::after {
      content: attr(data-tooltip); position: absolute; z-index: 20;
      left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
      padding: 5px 7px; border-radius: 5px; background: #020617; color: #e2e8f0;
      font-size: 10px; font-weight: 500; white-space: nowrap;
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .icon-btn:hover::after, .icon-btn:focus-visible::after { opacity: 1; visibility: visible; }
    .jump-panel {
      margin-top: 12px; padding: 12px; border: 1px solid #334155;
      background: #0f172a; border-radius: 9px;
    }
    .jump-panel.hidden { display: none; }
    .jump-top { display: flex; justify-content: space-between; gap: 10px; color: #94a3b8; font-size: 11px; }
    .jump-top strong { color: #38bdf8; font-variant-numeric: tabular-nums; }
    .jump-panel input[type="range"] { width: 100%; margin: 10px 0 5px; accent-color: #38bdf8; }
    .jump-row { display: flex; align-items: flex-end; gap: 8px; margin-top: 7px; }
    .jump-field { width: 92px; }
    .jump-field label { display: block; color: #64748b; font-size: 10px; margin-bottom: 4px; }
    .jump-field input {
      width: 100%; padding: 7px 8px; border: 1px solid #334155;
      border-radius: 6px; background: #111c33; color: #e2e8f0;
    }
    .jump-actions { display: flex; gap: 6px; margin-left: auto; }

    .skipped-panel { margin-top: 16px; }
    .skipped-panel li { align-items: flex-start; }
    .skipped-panel .details {
      display: flex; flex-direction: column; flex: 1; min-width: 0;
      color: #94a3b8; font-size: 12px;
    }
    .skipped-panel .details .ttl { color: #e2e8f0; font-size: 13px; margin-bottom: 2px; }
    .skipped-panel .details .file { font-family: ui-monospace, Consolas, monospace; color: #64748b; word-break: break-all; }

    footer {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 12px 22px; background: #0f172a; border-top: 1px solid #1e293b;
    }
    footer .left { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>Player</h1>
        <span class="ver">v1.0.0</span>
      </div>
      <div class="right">
        <span id="clock" class="clock">--:--:--</span>
        <span id="badge" class="badge offline">Offline</span>
        <span>Device: <span id="device" class="device">—</span></span>
      </div>
    </header>

    <main>
      <section class="now">
        <h2>Now Playing</h2>
        <div id="nowTitle" class="title empty">No active schedule</div>
        <div id="nowFile" class="file"></div>
        <div id="playbackDetails" class="playback-details hidden">
          <div class="playback-head">
            <strong id="currentMedia">—</strong>
            <span id="playlistPosition" class="playback-position"></span>
          </div>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div class="playback-time">
            <span id="playbackElapsed">00:00</span>
            <span id="playbackDuration">00:00</span>
          </div>
          <div id="nextMedia" class="playback-next"></div>
        </div>
        <div class="row">
          <div id="nowCountdown" class="countdown"></div>
          <div class="actions">
            <button id="btnRewind" class="btn icon-btn" data-tooltip="Rewind 10 seconds" aria-label="Rewind 10 seconds" disabled>
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M9.5 11v4"/><path d="M13 11.5a1.5 1.5 0 0 1 3 0v2a1.5 1.5 0 0 1-3 0z"/></svg>
            </button>
            <button id="btnPause" class="btn icon-btn" data-tooltip="Pause" aria-label="Pause" disabled>
              <svg viewBox="0 0 24 24"><rect class="solid" x="6" y="4" width="4" height="16"/><rect class="solid" x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button id="btnResume" class="btn icon-btn" data-tooltip="Resume" aria-label="Resume" disabled>
              <svg viewBox="0 0 24 24"><path class="solid" d="M7 4l13 8-13 8z"/></svg>
            </button>
            <button id="btnForward" class="btn icon-btn" data-tooltip="Forward 10 seconds" aria-label="Forward 10 seconds" disabled>
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v6h-6"/><path d="M8 11v4"/><path d="M11.5 11.5a1.5 1.5 0 0 1 3 0v2a1.5 1.5 0 0 1-3 0z"/></svg>
            </button>
            <button id="btnJump" class="btn icon-btn" data-tooltip="Jump To" aria-label="Jump to position" disabled>
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><path d="M8 2h8"/></svg>
            </button>
            <button id="btnSkip" class="btn icon-btn" data-tooltip="Skip Schedule" aria-label="Skip schedule" disabled>
              <svg viewBox="0 0 24 24"><path class="solid" d="M5 4l11 8-11 8z"/><path d="M19 5v14"/></svg>
            </button>
          </div>
        </div>
        <div id="jumpPanel" class="jump-panel hidden">
          <div class="jump-top"><span>Jump to position</span><strong id="jumpTargetLabel">00:00</strong></div>
          <input id="jumpSlider" type="range" min="0" max="0" value="0" step="1" />
          <div class="jump-row">
            <div class="jump-field"><label for="jumpMinutes">Minute</label><input id="jumpMinutes" type="number" min="0" value="0" /></div>
            <div class="jump-field"><label for="jumpSeconds">Second</label><input id="jumpSeconds" type="number" min="0" max="59" value="0" /></div>
            <div class="jump-actions">
              <button id="btnJumpApply" class="btn icon-btn primary" data-tooltip="Go" aria-label="Go to position">
                <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
              </button>
              <button id="btnJumpCancel" class="btn icon-btn" data-tooltip="Cancel" aria-label="Cancel jump">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="grid2">
        <section class="panel">
          <h2>Upcoming</h2>
          <ul id="upcoming"></ul>
        </section>
        <section class="panel">
          <h2>VLC</h2>
          <div>State: <span id="vlcState" class="vlc-state idle">idle</span></div>
          <div id="vlcNote" class="vlc-note"></div>
          <div class="btn-row">
            <button id="btnRetry" class="btn primary">Retry VLC</button>
            <button id="btnAddSchedule" class="btn" style="display:none;">Add Schedule</button>
            <button id="btnManageSchedules" class="btn" style="display:none;">Manage Schedules</button>
          </div>
          <div class="health-section">
            <div class="health-head">
              <h3>Media &amp; Storage</h3>
              <span id="healthState" class="health-state">Idle</span>
            </div>
            <div class="health-grid">
              <span>Ready<strong id="healthReady">0</strong></span>
              <span>Problems<strong id="healthProblems">0</strong></span>
              <span>Free space<strong id="healthFreeSpace">—</strong></span>
              <span>Last check<strong id="healthCheckedAt">—</strong></span>
            </div>
            <div id="healthDetails" class="health-details"></div>
            <button id="btnRecheckMedia" class="btn" style="margin-top:9px;">Recheck Media</button>
          </div>
        </section>
      </div>

      <section class="panel skipped-panel">
        <h2>Skipped</h2>
        <ul id="skipped"></ul>
      </section>
    </main>

    <footer>
      <div class="left">
        <button id="btnConfig" class="btn">Open Config Folder</button>
        <button id="btnLogout" class="btn danger">Logout</button>
      </div>
      <div>
        <button id="btnQuit" class="btn danger">Quit Player</button>
      </div>
    </footer>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);

    function fmtCountdown(ms) {
      if (ms == null || isNaN(ms)) return '';
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return `ends in ${pad(h)}:${pad(m)}:${pad(sec)}`;
    }

    function fmtTime(ms) {
      if (ms == null) return '';
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function fmtDate(ms) {
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function badgeClass(status) {
      if (status === 'online') return 'badge online';
      if (status === 'connecting') return 'badge connecting';
      if (status && status.indexOf('test-mode') === 0) return 'badge test-mode';
      if (status === 'vlc-error') return 'badge vlc-error';
      if (status === 'vlc-recovering') return 'badge vlc-recovering';
      return 'badge offline';
    }

    function badgeLabel(status) {
      if (status && status.indexOf('test-mode') === 0) return 'Test Mode';
      if (status === 'vlc-error') return 'VLC Error';
      if (status === 'vlc-recovering') return 'VLC Recovering';
      return status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Offline';
    }

    let state = {
      status: 'offline', deviceId: '', now: null, upcoming: [], skipped: [],
      vlc: { state: 'idle' },
      watchdog: { state: 'idle', attempts: 0, maxAttempts: 5 },
      recoveryResume: null,
      mediaHealth: null,
      bypass: false
    };
    let jumpPanelOpen = false;
    let jumpMaxSeconds = 0;
    let jumpMediaKey = '';
    let controlError = '';

    ipcRenderer.on('dashboard:update', (_e, payload) => {
      state = Object.assign({}, state, payload);
      render();
    });

    function fmtPlaybackTime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      const pad = value => String(value).padStart(2, '0');
      return hours > 0
        ? `${pad(hours)}:${pad(minutes)}:${pad(secs)}`
        : `${pad(minutes)}:${pad(secs)}`;
    }

    function currentPlayback() {
      return state.vlc && state.vlc.playback ? state.vlc.playback : {};
    }

    function playbackMediaKey(playback) {
      return `${Number.isInteger(playback.currentIndex) ? playback.currentIndex : -1}|${playback.currentPath || ''}`;
    }

    function clampJumpTarget(seconds) {
      const target = Math.floor(Number(seconds) || 0);
      return Math.max(0, Math.min(jumpMaxSeconds, target));
    }

    function setJumpTarget(seconds) {
      const target = clampJumpTarget(seconds);
      $('jumpSlider').value = String(target);
      $('jumpMinutes').value = String(Math.floor(target / 60));
      $('jumpSeconds').value = String(target % 60);
      $('jumpTargetLabel').textContent = `${fmtPlaybackTime(target)} / ${fmtPlaybackTime(jumpMaxSeconds + 1)}`;
      return target;
    }

    function syncJumpTargetFromInputs() {
      const minutes = Math.max(0, Math.floor(Number($('jumpMinutes').value) || 0));
      const seconds = Math.max(0, Math.min(59, Math.floor(Number($('jumpSeconds').value) || 0)));
      return setJumpTarget((minutes * 60) + seconds);
    }

    function openJumpPanel() {
      const playback = currentPlayback();
      jumpMaxSeconds = Math.max(0, Math.floor(Number(playback.lengthSeconds) || 0) - 1);
      jumpMediaKey = playbackMediaKey(playback);
      $('jumpSlider').max = String(jumpMaxSeconds);
      $('jumpMinutes').max = String(Math.floor(jumpMaxSeconds / 60));
      setJumpTarget(playback.positionSeconds);
      jumpPanelOpen = true;
      $('jumpPanel').classList.remove('hidden');
    }

    function closeJumpPanel() {
      jumpPanelOpen = false;
      jumpMediaKey = '';
      $('jumpPanel').classList.add('hidden');
    }

    async function invokePlaybackControl(channel, value) {
      controlError = '';
      try {
        const result = value === undefined
          ? await ipcRenderer.invoke(channel)
          : await ipcRenderer.invoke(channel, value);
        if (result && result.ok === false) {
          throw new Error(result.error || 'Playback control failed');
        }
        return result;
      } catch (error) {
        controlError = error && error.message ? error.message : String(error);
        render();
        return null;
      }
    }

    function fmtBytes(bytes) {
      if (bytes == null || !Number.isFinite(Number(bytes))) return 'Unknown';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = Number(bytes);
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(unit >= 3 ? 1 : 0)} ${units[unit]}`;
    }

    function renderMediaHealth() {
      const health = state.mediaHealth || {};
      const counts = health.counts || {};
      const problemCount = (Number(counts.missing) || 0) +
        (Number(counts.corrupt) || 0) + (Number(counts.unreadable) || 0);
      const healthState = health.state || 'idle';
      $('healthState').textContent = healthState;
      $('healthState').className = `health-state ${healthState}`;
      $('healthReady').textContent = Number(counts.ready) || 0;
      $('healthProblems').textContent = problemCount;
      $('healthFreeSpace').textContent = health.disk ? fmtBytes(health.disk.freeBytes) : '—';
      $('healthCheckedAt').textContent = health.checkedAt
        ? new Date(health.checkedAt).toLocaleTimeString()
        : '—';
      const problems = (health.items || []).filter(item => item.status !== 'ready');
      $('healthDetails').textContent = problems.slice(0, 3)
        .map(item => `${item.title}: ${item.status}${item.reason ? ` (${item.reason})` : ''}`)
        .join(' · ');
      if (problems.length > 3) {
        $('healthDetails').textContent += ` · +${problems.length - 3} more`;
      }
      if (health.disk && health.disk.lowSpace) {
        $('healthDetails').textContent +=
          `${$('healthDetails').textContent ? ' · ' : ''}Low disk space`;
      }
      $('btnRecheckMedia').disabled = healthState === 'checking';
      $('btnRecheckMedia').textContent = healthState === 'checking' ? 'Checking...' : 'Recheck Media';
    }

    function renderPlayback(now, vlc) {
      const details = $('playbackDetails');
      const files = now && Array.isArray(now.files) ? now.files : [];
      const playback = vlc && vlc.playback ? vlc.playback : {};
      let index = Number.isInteger(playback.currentIndex) ? playback.currentIndex : -1;
      if (index < 0 && playback.currentPath) {
        index = files.findIndex(file => (
          String(file.localPath || file.path || '').toLowerCase() ===
          String(playback.currentPath).toLowerCase()
        ));
      }
      if (!now || index < 0 || !files[index] || vlc.idleMode) {
        details.classList.add('hidden');
        $('progressFill').style.width = '0%';
        return;
      }

      const current = files[index];
      const position = Math.max(0, Number(playback.positionSeconds) || 0);
      const length = Math.max(0, Number(playback.lengthSeconds) || 0);
      const percentage = length > 0 ? Math.min(100, (position / length) * 100) : 0;
      const nextIndex = index + 1 < files.length
        ? index + 1
        : (now.loop !== false && files.length > 1 ? 0 : -1);
      const next = nextIndex >= 0 ? files[nextIndex] : null;

      $('currentMedia').textContent = current.title || current.path || current.assetId || 'Current media';
      $('playlistPosition').textContent = `${index + 1} of ${files.length}`;
      $('progressFill').style.width = `${percentage}%`;
      $('playbackElapsed').textContent = fmtPlaybackTime(position);
      $('playbackDuration').textContent = length > 0 ? fmtPlaybackTime(length) : 'Detecting duration...';
      $('nextMedia').textContent = next
        ? `Next: ${next.title || next.path || next.assetId}`
        : 'Last item in playlist';
      details.classList.remove('hidden');
    }

    function render() {
      $('badge').className = badgeClass(state.status);
      $('badge').textContent = badgeLabel(state.status);
      $('device').textContent = state.deviceId || '—';
      $('btnAddSchedule').style.display = state.bypass ? 'inline-block' : 'none';
      $('btnManageSchedules').style.display = state.bypass ? 'inline-block' : 'none';
      renderMediaHealth();

      const now = state.now;
      if (now) {
        $('nowTitle').textContent = now.title || now.scheduleId;
        $('nowTitle').classList.remove('empty');
        $('nowFile').textContent = (now.files || [])
          .map(file => file.title || file.path || file.assetId)
          .filter(Boolean)
          .join(' â†’ ');
        const remaining = now.endMs ? (now.endMs - Date.now()) : null;
        $('nowCountdown').textContent = fmtCountdown(remaining);
      } else {
        $('nowTitle').textContent = 'No active schedule';
        $('nowTitle').classList.add('empty');
        $('nowFile').textContent = '';
        $('nowCountdown').textContent = '';
      }

      const vlc = state.vlc || {};
      renderPlayback(now, vlc);
      const vlcEl = $('vlcState');
      const displayState = (vlc.state === 'playing' && vlc.idleMode) ? 'idle' : (vlc.state || 'idle');
      vlcEl.className = 'vlc-state ' + displayState;
      vlcEl.textContent = displayState;
      const watchdog = state.watchdog || {};
      if (watchdog.state === 'recovering') {
        $('vlcNote').textContent =
          `Automatic recovery attempt ${watchdog.attempts}/${watchdog.maxAttempts} is running...`;
      } else if (watchdog.state === 'waiting') {
        const seconds = watchdog.nextRetryAt
          ? Math.max(0, Math.ceil((watchdog.nextRetryAt - Date.now()) / 1000))
          : 0;
        $('vlcNote').textContent =
          `Recovery attempt ${watchdog.attempts}/${watchdog.maxAttempts} failed. Retrying in ${seconds}s.` +
          (watchdog.lastError ? ` ${watchdog.lastError}` : '');
      } else if (watchdog.state === 'exhausted') {
        $('vlcNote').textContent =
          `Automatic recovery stopped after ${watchdog.attempts} attempts. Click Retry VLC.` +
          (watchdog.lastError ? ` ${watchdog.lastError}` : '');
      } else if (watchdog.state === 'degraded') {
        $('vlcNote').textContent = 'Playback health check failed. Waiting for confirmation before recovery.';
      } else if (controlError) {
        $('vlcNote').textContent = `Playback control failed: ${controlError}`;
      } else if (state.recoveryResume && now && state.recoveryResume.scheduleId === now.scheduleId) {
        $('vlcNote').textContent =
          `Recovered: resumed ${state.recoveryResume.title} at ` +
          `${fmtPlaybackTime(state.recoveryResume.positionSeconds)}.`;
      } else {
        $('vlcNote').textContent = (vlc.state === 'error')
          ? 'VLC is unavailable. Automatic recovery will run while a schedule is active.'
          : '';
      }

      const hasNow = !!now;
      const isIdleMode = !!vlc.idleMode;
      const playing = vlc.state === 'playing';
      const paused = vlc.state === 'paused';
      const playback = vlc.playback || {};
      const hasDuration = Number.isFinite(Number(playback.lengthSeconds)) && Number(playback.lengthSeconds) > 0;
      const hasCurrentItem = Number.isInteger(playback.currentIndex) && playback.currentIndex >= 0;
      const canSeek = hasNow && !isIdleMode && (playing || paused) && hasDuration && hasCurrentItem;
      $('btnPause').disabled = !(hasNow && playing && !isIdleMode);
      $('btnResume').disabled = !(hasNow && paused && !isIdleMode);
      $('btnRewind').disabled = !canSeek;
      $('btnForward').disabled = !canSeek;
      $('btnJump').disabled = !canSeek;
      $('btnSkip').disabled = !hasNow;
      if (jumpPanelOpen) {
        const mediaChanged = jumpMediaKey !== playbackMediaKey(playback);
        if (!canSeek || mediaChanged) {
          closeJumpPanel();
        } else {
          jumpMaxSeconds = Math.max(0, Math.floor(Number(playback.lengthSeconds)) - 1);
          $('jumpSlider').max = String(jumpMaxSeconds);
          $('jumpMinutes').max = String(Math.floor(jumpMaxSeconds / 60));
          setJumpTarget($('jumpSlider').value);
        }
      }

      const upEl = $('upcoming');
      upEl.innerHTML = '';
      if (!state.upcoming || !state.upcoming.length) {
        const li = document.createElement('li');
        li.innerHTML = '<span class="empty">No upcoming schedules</span>';
        upEl.appendChild(li);
      } else {
        for (const it of state.upcoming) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="time">${fmtDate(it.startMs)}</span>` +
                         `<span class="ttl" title="${it.title}">${it.title}</span>` +
                         `<span class="rec">${it.freqLabel || ''}</span>`;
          upEl.appendChild(li);
        }
      }

      const skEl = $('skipped');
      skEl.innerHTML = '';
      if (!state.skipped || !state.skipped.length) {
        const li = document.createElement('li');
        li.innerHTML = '<span class="empty">No skipped schedules</span>';
        skEl.appendChild(li);
      } else {
        for (const it of state.skipped) {
          const li = document.createElement('li');
          const start = it.startTime ? fmtDate(new Date(it.startTime).getTime()) : '-';
          const end = it.endTime ? fmtDate(new Date(it.endTime).getTime()) : '-';
          const file = (it.files || [])
            .map(item => item.title || item.path || item.assetId)
            .filter(Boolean)
            .join(' â†’ ');
          li.innerHTML = `<div class="details">` +
                           `<span class="ttl" title="${it.title}">${it.title}</span>` +
                           `<span>${start} → ${end}</span>` +
                           `<span class="file">${file}</span>` +
                         `</div>` +
                         `<button class="btn primary" data-id="${it.scheduleId}">Reactivate</button>`;
          skEl.appendChild(li);
        }
        skEl.querySelectorAll('button[data-id]').forEach((btn) => {
          btn.onclick = () => ipcRenderer.invoke('vlc-reactivate', btn.dataset.id);
        });
      }
    }

    $('btnRewind').onclick = () => invokePlaybackControl('vlc-seek-relative', -10);
    $('btnPause').onclick  = () => invokePlaybackControl('vlc-pause');
    $('btnResume').onclick = () => invokePlaybackControl('vlc-resume');
    $('btnForward').onclick = () => invokePlaybackControl('vlc-seek-relative', 10);
    $('btnJump').onclick = () => jumpPanelOpen ? closeJumpPanel() : openJumpPanel();
    $('jumpSlider').oninput = () => setJumpTarget($('jumpSlider').value);
    $('jumpMinutes').oninput = syncJumpTargetFromInputs;
    $('jumpSeconds').oninput = syncJumpTargetFromInputs;
    $('btnJumpCancel').onclick = closeJumpPanel;
    $('btnJumpApply').onclick = async () => {
      const target = syncJumpTargetFromInputs();
      $('btnJumpApply').disabled = true;
      const result = await invokePlaybackControl('vlc-seek-to', target);
      $('btnJumpApply').disabled = false;
      if (result) closeJumpPanel();
    };
    $('btnSkip').onclick   = () => ipcRenderer.invoke('vlc-skip');
    $('btnRetry').onclick  = () => ipcRenderer.invoke('vlc-retry');
    $('btnAddSchedule').onclick = () => ipcRenderer.invoke('open-schedule-adder');
    $('btnManageSchedules').onclick = () => ipcRenderer.invoke('open-schedule-manager');
    $('btnRecheckMedia').onclick = async () => {
      $('btnRecheckMedia').disabled = true;
      $('btnRecheckMedia').textContent = 'Checking...';
      const result = await ipcRenderer.invoke('recheck-media-health');
      if (!result || !result.ok) {
        $('healthDetails').textContent = result && result.error || 'Media health check failed';
        $('btnRecheckMedia').disabled = false;
        $('btnRecheckMedia').textContent = 'Recheck Media';
      }
    };
    $('btnConfig').onclick = () => ipcRenderer.invoke('open-config-folder');
    $('btnLogout').onclick = () => ipcRenderer.invoke('logout');
    $('btnQuit').onclick   = () => ipcRenderer.invoke('quit');

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    render();
  </script>
</body>
</html>
