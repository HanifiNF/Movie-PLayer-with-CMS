<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player — Add Test Schedule</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%; max-width: 420px;
      background: #1e293b; padding: 28px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
    .subtitle { margin: 0 0 22px; font-size: 12px; color: #94a3b8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 14px 0 6px; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
      width: 100%; padding: 10px 12px; border: 1px solid #334155;
      background: #0f172a; color: #e2e8f0; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #38bdf8; }
    input:invalid { border-color: #f87171; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      width: 100%; margin-top: 22px; padding: 12px;
      background: #38bdf8; color: #0f172a; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-secondary {
      margin-top: 10px;
      background: transparent;
      color: #38bdf8;
      border: 1px solid #334155;
      font-weight: 500;
    }
    .btn-secondary:hover { background: #0f172a; border-color: #38bdf8; }
    .err {
      margin-top: 14px; padding: 10px 12px; border-radius: 6px;
      background: #7f1d1d; color: #fecaca; font-size: 12px; display: none;
    }
    .err.show { display: block; }
    .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <h1>Add Test Schedule</h1>
    <p class="subtitle">Create a one-time local schedule for Test Mode.</p>

    <label>Schedule name</label>
    <input name="title" type="text" placeholder="e.g. Morning Ad" required autocomplete="off" />

    <div class="row">
      <div>
        <label>Start date</label>
        <input name="startDate" type="date" required />
      </div>
      <div>
        <label>Start time</label>
        <input name="startTime" type="time" step="1" required />
        <div class="hint">HH:MM:SS</div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Duration minutes</label>
        <input name="durationMinutes" type="number" min="0" value="60" required />
      </div>
      <div>
        <label>Duration seconds</label>
        <input name="durationSeconds" type="number" min="0" max="59" value="0" required />
      </div>
    </div>

    <label>Video path</label>
    <input name="path" type="text" placeholder="C:\\Users\\...\\video.mp4" required autocomplete="off" />
    <div class="hint">Full absolute path to local video file.</div>

    <button type="submit" id="btnSave">Save Schedule</button>
    <button type="button" id="btnCancel" class="btn-secondary">Cancel</button>

    <div class="err" id="err"></div>
  </form>

  <script>
    const { ipcRenderer } = require('electron');
    const form = document.getElementById('f');
    const btn = document.getElementById('btnSave');
    const errEl = document.getElementById('err');

    ipcRenderer.invoke('get-test-file').then((path) => {
      if (path) form.path.value = path;
    }).catch(() => {});

    // Default date = today
    try {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      form.startDate.value = `${yyyy}-${mm}-${dd}`;
    } catch (_) {}

    function setBusy(busy) {
      btn.disabled = busy;
      btn.textContent = busy ? 'Saving...' : 'Save Schedule';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      setBusy(true);
      const fd = new FormData(form);
      const payload = {
        title: fd.get('title'),
        startDate: fd.get('startDate'),
        startTime: fd.get('startTime'),
        durationMinutes: parseInt(fd.get('durationMinutes'), 10),
        durationSeconds: parseInt(fd.get('durationSeconds'), 10),
        path: fd.get('path')
      };
      try {
        const result = await ipcRenderer.invoke('add-test-schedule', payload);
        if (!result || !result.ok) throw new Error(result && result.error || 'Failed to add schedule');
        window.close();
      } catch (err) {
        errEl.textContent = err.message || String(err);
        errEl.classList.add('show');
        setBusy(false);
      }
    };

    document.getElementById('btnCancel').onclick = () => window.close();
  </script>
</body>
</html>
